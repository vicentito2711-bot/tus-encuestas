<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff7f1,#f3dfd0);color:#4b2a20}
.wrap{max-width:900px;margin:auto;padding:20px}
.card{position:relative;background:#fff;border-radius:28px;padding:120px 24px 35px;box-shadow:0 10px 30px #00000018;overflow:hidden}
.corner{position:absolute;top:12px;width:145px;height:145px;object-fit:contain}
.left{left:8px} .right{right:8px}
.brand{width:max-content;max-width:90%;margin:0 auto 14px;padding:11px 24px;border-radius:999px;background:linear-gradient(135deg,#6e351f,#bd7049);color:#fff;font-weight:800;letter-spacing:1.5px;font-size:22px;box-shadow:0 6px 16px #6e351f35}
h1{text-align:center;color:#6e351f;font-size:clamp(27px,5vw,43px);margin:8px 0}
.sub{text-align:center;color:#79584d;font-size:17px;margin-bottom:25px}
.question{background:#fffaf7;border:2px solid #efd7c8;border-radius:20px;padding:22px;margin:18px 0}
.question h2{font-size:21px;margin:0 0 15px;color:#69351f}
.option{display:block;background:#fff;border:1px solid #e6c9b8;border-radius:13px;padding:13px;margin:9px 0;cursor:pointer}
.option:hover{background:#fff1e9}
textarea{width:100%;min-height:135px;border:1px solid #d6b6a3;border-radius:13px;padding:13px;font:inherit;resize:vertical}
button{display:block;margin:24px auto 10px;border:0;border-radius:999px;background:#7b3f25;color:white;font-size:17px;font-weight:bold;padding:14px 30px;cursor:pointer}
button:hover{background:#5f2e1b}
#msg{text-align:center;font-weight:bold;min-height:25px;color:#3f7040}
.qr{text-align:center;margin:28px auto 0;padding:20px;border:2px dashed #d8b29e;border-radius:20px;max-width:330px}
.qr img{width:190px;max-width:100%}
.small{font-size:12px;color:#80685d;text-align:center;margin-top:18px}
@media(max-width:600px){.card{padding:100px 14px 25px}.corner{width:105px;height:105px}.brand{font-size:18px;padding:9px 18px}}
</style>
