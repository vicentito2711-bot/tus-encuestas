<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta - Súper Trencito Squishy de Chocolate</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4a2e18, #8B4513);
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            color: #333;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #D2691E;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .question-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #fdfaf6;
            border-left: 5px solid #D2691E;
            border-radius: 8px;
        }
        .question-content {
            flex: 1;
            min-width: 250px;
        }
        .question-image {
            flex: 0 0 180px;
            text-align: center;
        }
        .question-image img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            border: 2px solid #D2691E;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .options-group label {
            font-weight: normal;
            margin-bottom: 6px;
            cursor: pointer;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        button {
            display: block;
            width: 100%;
            background-color: #D2691E;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #A0522D;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍫 Encuesta Súper Trencito 🐱</h1>
    <p class="subtitle">¡Ayúdanos a mejorar este increíble concepto de chocolate con oblea!</p>

    <!-- Formulario con enlace directo a tu correo -->
    <form action="mailto:vicentito2711@gmail.com" method="POST" enctype="text/plain">
        
        <!-- Pregunta 1 + Imagen 2 -->
        <div class="question-row">
            <div class="question-content">
                <label>1. ¿Cuánto te gusta el concepto del Súper Trencito / Squishy de chocolate?</label>
                <div class="options-group">
                    <label><input type="radio" name="p1_gusto" value="Me encanta muchísimo, está genial" required> Me encanta muchísimo, está genial</label>
                    <label><input type="radio" name="p1_gusto" value="Me gusta bastante"> Me gusta bastante</label>
                    <label><input type="radio" name="p1_gusto" value="Está más o menos, regular"> Está más o menos, regular</label>
                    <label><input type="radio" name="p1_gusto" value="No me llama mucho la atención"> No me llama mucho la atención</label>
                    <label><input type="radio" name="p1_gusto" value="No me gusta para nada"> No me gusta para nada</label>
                    <label><input type="radio" name="p1_gusto" value="¡Quiero comprarlo ya mismo!"> ¡Quiero comprarlo ya mismo!</label>
                </div>
            </div>
            <div class="question-image">
                <img src="image_2.png" alt="Squishy Gato 1">
            </div>
        </div>

        <!-- Pregunta 2 + Imagen 3 -->
        <div class="question-row">
            <div class="question-content">
                <label for="p2_detalles">2. ¿Qué detalles crees que le faltan al diseño o al producto?</label>
                <textarea id="p2_detalles" name="p2_detalles" placeholder="Escribe aquí tus sugerencias..."></textarea>
            </div>
            <div class="question-image">
                <img src="image_3.png" alt="Squishy Gato 2">
            </div>
        </div>

        <!-- Pregunta 3 + Imagen 4 -->
        <div class="question-row">
            <div class="question-content">
                <label for="p3_marcas">3. Si pudiéramos combinar esta marca con otra marca o franquicia, ¿cuál te gustaría que fuera?</label>
                <input type="text" id="p3_marcas" name="p3_marcas" placeholder="Ej: Pokémon, Roblox, Fanta, etc.">
            </div>
            <div class="question-image">
                <img src="image_4.png" alt="Squishy Gato 3">
            </div>
        </div>

        <button type="submit">Enviar Respuestas</button>
    </form>
</div>

</body>
</html>
